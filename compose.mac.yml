# Overrides layered on top of Vexa's own docker-compose.yml and
# docker-compose.local-db.yml. See scripts/lib.sh for how they are combined.
services:
  api-gateway:
    environment:
      # Upstream hard-codes Vexa's hosted share URL.
      - PUBLIC_BASE_URL=http://localhost:${API_GATEWAY_HOST_PORT:-8056}

  # MinIO only stores meeting recordings, which are off by default, and the
  # minio/mc image is no longer on Docker Hub. Recordings use local disk
  # (STORAGE_BACKEND=local). Start these with --profile minio if you need them.
  minio:
    profiles: ["minio"]
  minio-init:
    profiles: ["minio"]

  whisperlive:
    # Make sure WhisperLive can reach the native Whisper server on the Mac.
    extra_hosts:
      - "host.docker.internal:host-gateway"
